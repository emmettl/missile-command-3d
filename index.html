<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#05060f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>Missile Command 3D</title>
    <meta
      name="description"
      content="A 3D take on the arcade classic. Defend six cities from incoming warheads, MIRVs and smart bombs."
    />

    <!-- Link previews (iMessage, WhatsApp, Slack, Signal, social). Scrapers do not run
         JavaScript, so these live in the static HTML; og:image must be an absolute URL.
         The filename is versioned: WhatsApp and iMessage cache a preview against the
         image URL for a long time, so replacing the file in place would leave everyone
         who has ever shared the link looking at the old screenshot. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Missile Command 3D" />
    <meta property="og:title" content="Missile Command 3D" />
    <meta
      property="og:description"
      content="A 3D take on the arcade classic. Defend six cities from incoming warheads, MIRVs and smart bombs."
    />
    <meta property="og:url" content="https://emmettl.github.io/missile-command-3d/" />
    <meta property="og:image" content="https://emmettl.github.io/missile-command-3d/og-v2.jpg" />
    <meta property="og:image:secure_url" content="https://emmettl.github.io/missile-command-3d/og-v2.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="MISSILE COMMAND 3D title over a glowing wireframe globe, a missile arcing across it"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Missile Command 3D" />
    <meta
      name="twitter:description"
      content="A 3D take on the arcade classic. Defend six cities from incoming warheads, MIRVs and smart bombs."
    />
    <meta name="twitter:image" content="https://emmettl.github.io/missile-command-3d/og-v2.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
